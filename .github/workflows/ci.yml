name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-shell:
    name: Unit and shell checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          bash -n install.sh install-macos.sh uninstall.sh uninstall-macos.sh \
            selftest.sh selftest-macos.sh start-mediamtx.sh rotate-credentials.sh \
            tests/e2e-local.sh tests/test-rotate-credentials.sh
      - name: Test local control commands
        run: |
          ./tests/test-rotate-credentials.sh
          ./tests/test-recording-control.sh

  srt-end-to-end:
    name: Authenticated SRT end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl openssl
      - name: Publish and read H.264/AAC over SRT
        run: ./tests/e2e-local.sh
